name: NH bill tracker refresh

# Pulls the General Court's bill-status data dump, rebuilds data/*.json, commits
# the result, and (on the default branch) publishes the site to GitHub Pages.
#
# Schedule: the General Court asks automated clients to use the site between
# 9 p.m. and 6 a.m. Eastern. GitHub starts scheduled runs late, sometimes by
# hours (the 07:35 UTC slot ran at 14:03 and 14:43 UTC on Oct 1-2, 2026, in the
# daytime hours the General Court asks automated clients to avoid). So the job
# is offered every hour from
# 02:17 to 09:17 UTC (22:17-05:17 EDT, 21:17-04:17 EST). The first slot that
# fetches a full set of files wins; the later slots see a fresh fetch and stop.

on:
  schedule:
    - cron: "17 2-9 * * *"
  workflow_dispatch:
    inputs:
      sessions:
        description: "Session years to build (comma-separated)"
        default: "2025,2026,2027"
        required: false
      force_fetch:
        description: "Fetch from gc.nh.gov even during the day (use sparingly)"
        default: "false"
        required: false
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/nh-bills.yml"
      - "scripts/**"
      - "nh-bills/**"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/nh-bills.yml"
      - "scripts/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nh-bills-${{ github.ref }}
  cancel-in-progress: false

env:
  # On pull_request events github.ref_name is "<n>/merge"; the head branch is what we build and push to.
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  refresh:
    name: Fetch and build data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether to fetch
        id: plan
        # The General Court asks automated clients to stay off the site between
        # 6 a.m. and 9 p.m. Eastern. Any run in that window rebuilds from the saved raw files instead of
        # fetching, unless a manual run sets force_fetch. A scheduled run stops
        # early when the files were pulled in the last 18 hours (an earlier slot
        # already got them) or, in the daytime, when the data was rebuilt in the
        # last 18 hours.
        run: |
          HOUR=$((10#$(TZ=America/New_York date +%H)))
          NOW=$(date -u +%s)
          age() { if [ -f "$1" ]; then T=$(date -u -d "$(head -c 40 "$1" | tr -d '\n')" +%s 2>/dev/null || echo 0); echo $(( (NOW - T) / 3600 )); else echo 9999; fi; }
          FETCH_AGE=$(age data/raw/_fetched_at.txt)
          BUILT=$(python3 -c "import json;print(json.load(open('data/index.json')).get('generated_at',''))" 2>/dev/null || true)
          if [ -n "$BUILT" ]; then BUILT_AGE=$(( (NOW - $(date -u -d "$BUILT" +%s 2>/dev/null || echo 0)) / 3600 )); else BUILT_AGE=9999; fi
          DAY=false; if [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 21 ]; then DAY=true; fi
          ACTION=fetch
          if [ "${{ github.event.inputs.force_fetch || 'false' }}" != "true" ] && [ "$DAY" = true ]; then ACTION=offline; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$FETCH_AGE" -lt 18 ]; then ACTION=skip
            elif [ "$ACTION" = offline ] && [ "$BUILT_AGE" -lt 18 ]; then ACTION=skip; fi
          fi
          echo "Eastern hour $HOUR; files pulled ${FETCH_AGE} h ago; data built ${BUILT_AGE} h ago; event ${{ github.event_name }}: $ACTION"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Build dataset
        if: steps.plan.outputs.action != 'skip'
        run: |
          MODE=""
          if [ "${{ steps.plan.outputs.action }}" = "offline" ]; then
            MODE="--offline"
            echo "Daytime Eastern: rebuilding from data/raw without fetching."
          fi
          python scripts/fetch_nh_bills.py --sessions "${{ github.event.inputs.sessions || '2025,2026,2027' }}" --out data $MODE

      - name: Summarize
        if: always() && steps.plan.outputs.action != 'skip'
        run: |
          echo "## Data files" >> "$GITHUB_STEP_SUMMARY"
          ls -la data data/raw 2>/dev/null | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f data/index.json ]; then echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat data/index.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload discovery report and raw files
        if: always() && steps.plan.outputs.action != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: nh-bills-data-${{ github.run_number }}
          path: data
          retention-days: 14
          if-no-files-found: warn

      - name: Commit refreshed data
        id: commit
        # Pull-request runs validate the build only. A bot commit on a PR branch
        # would start another pull_request run that GitHub holds for approval.
        if: always() && github.event_name != 'pull_request' && steps.plan.outputs.action != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: NH bill tracker refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  pages-check:
    name: Is GitHub Pages enabled?
    needs: refresh
    if: github.ref_name == github.event.repository.default_branch && needs.refresh.outputs.action != 'skip'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        # The workflow token cannot turn Pages on (that is a one-time click under
        # Settings > Pages > Source: GitHub Actions). Until then, skip the deploy
        # instead of failing the nightly refresh.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "GitHub Pages is enabled; deploying."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::warning::GitHub Pages is not enabled for this repository. Enable it once under Settings > Pages > Source: GitHub Actions and the next run will deploy."
          fi

  deploy:
    name: Publish to GitHub Pages
    needs: pages-check
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
